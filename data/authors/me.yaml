bio: "Songyu Ke is an associate professor at Fuzhou University. His research interests include urban computing, spatiotemporal data mining and modeling, and representation learning for low-quality data. He has published numerous papers in journals such as Artificial Intelligence, IEEE Transactions on Knowledge and Data Engineering, and international conferences such as AAAI, IJCAI, and IJCNN, and has served as a program committee member/reviewer for conferences such as AAAI, WSDM, KDD, and CIKM."
